# Slowrun FineWeb configuration. Prepare data first:
#   uv sync --extra slowrun
#   uv run python prepare_slowrun_data.py
model:
  activation_type: "swiglu"
  dropout_p: 0.1
  d_model: 512
  linear_d_hidden: 2048
  norm_eps: 1e-5
  use_bias: true
  use_qkNorm: false
  tie_word_embeddings: true
  use_rotary: true
  max_seq_len: 2048
  n_heads: 16
  d_head: 32
  n_kv_heads: null
  n_layers: 12
  vocab_size: 50257
  attention_type: "mha"
  mhla_config: null

training:
  batch_size: 8
  micro_batch_size: 1
  eval_batch_size: 1
  grad_accum_steps: 8
  epochs: 1
  lr: 3e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 100
  optimizer: "adamw"
  scheduler: "cosine"
  log_every: 10
  eval_every: 500
  eval_steps: null
  eval_on_start: true
  eval_on_end: true

data:
  dataset: "slowrun"
  data_dir: "fineweb_data"
  tokenizer: "gpt2"
  doc_shuffle: true
  eval_tokens: 10000000
  seed: 42

logging:
  enabled: true
  project: "nanogpt-jax-slowrun"
  group: "slowrun"
  job_type: "train"
  tags: ["slowrun", "fineweb", "jax"]
  save_code: true
