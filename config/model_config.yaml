# Standard MHA configuration
model:
  activation_type: "gelu"
  dropout_p: 0.1
  d_model: 512
  linear_d_hidden: 2048
  norm_eps: 1e-5
  use_bias: true
  use_qkNorm: false
  tie_word_embeddings: true
  use_rotary: true
  max_seq_len: 64
  n_heads: 16
  d_head: 32
  n_kv_heads: null
  n_layers: 12
  vocab_size: 50257
  attention_type: "mha"
  mhla_config: null

training:
  batch_size: 16
  micro_batch_size: 8
  eval_batch_size: 8
  grad_accum_steps: 2
  epochs: 1
  lr: 3e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 100
  optimizer: "adamw"
  scheduler: "cosine"
  log_every: 10
  eval_every: 500
  eval_steps: 50
  eval_on_start: true
  eval_on_end: true

data:
  dataset: "tinyshakespeare"
  tokenizer: "gpt2"
  seed: 42

logging:
  enabled: true
  project: "nanogpt-equinox"
  tags: ["tinyshakespeare"]
  save_code: true
