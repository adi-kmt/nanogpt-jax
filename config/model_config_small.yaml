# Small configuration for smoke tests and local debugging
model:
  activation_type: "gelu"
  dropout_p: 0.1
  d_model: 64
  linear_d_hidden: 256
  norm_eps: 1e-5
  use_bias: true
  use_qkNorm: false
  tie_word_embeddings: true
  use_rotary: true
  max_seq_len: 64
  n_heads: 4
  d_head: 16
  n_kv_heads: null
  n_layers: 2
  vocab_size: 50257
  attention_type: "mha"
  mhla_config: null
  param_dtype: "float32"
  compute_dtype: null
  logits_dtype: "float32"

training:
  batch_size: 8
  micro_batch_size: 4
  eval_batch_size: 4
  grad_accum_steps: 2
  epochs: 1
  lr: 3e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 10
  scheduler: "cosine"
  optimizer_state_dtype: "float32"
  optimizer_groups:
    - name: "frozen"
      optimizer: "frozen"
      match: ["rotary"]
      lr_multiplier: 0.0
      weight_decay: false
    - name: "adamw_no_decay"
      optimizer: "adamw"
      match: ["no_decay"]
      lr_multiplier: 1.0
      weight_decay: false
    - name: "adamw_decay"
      optimizer: "adamw"
      match: ["default"]
      lr_multiplier: 1.0
      weight_decay: true
  log_every: 10
  eval_every: 100
  eval_steps: 10
  eval_on_start: true
  eval_on_end: true

data:
  dataset: "tinyshakespeare"
  tokenizer: "gpt2"
  seed: 42

logging:
  enabled: true
  project: "nanogpt-equinox"
  tags: ["tinyshakespeare", "smoke"]
  save_code: true
