# Model configuration with MHLA attention
model:
  activation_type: "gelu"
  dropout_p: 0.1
  d_model: 512
  linear_d_hidden: 1024
  norm_eps: 1e-5
  use_bias: true
  use_qkNorm: true
  tie_word_embeddings: false
  use_rotary: true
  max_seq_len: 64
  n_heads: 16
  d_head: 32
  n_layers: 12
  vocab_size: 50257
  attention_type: "mhla"
  mhla_config:
    d_c: 256
    d_c1: 256
    d_r: 16

# Training configuration
training:
  batch_size: 16
  micro_batch_size: 8
  eval_batch_size: 1
  grad_accum_steps: 2
  epochs: 1
  lr: 3e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 100
  scheduler: "cosine"
  optimizer_groups:
    - name: "frozen"
      optimizer: "frozen"
      match: ["rotary"]
      lr_multiplier: 0.0
      weight_decay: false
    - name: "adamw_no_decay"
      optimizer: "adamw"
      match: ["no_decay"]
      lr_multiplier: 1.0
      weight_decay: false
    - name: "adamw_decay"
      optimizer: "adamw"
      match: ["default"]
      lr_multiplier: 1.0
      weight_decay: true
  log_every: 10
  eval_every: 500
  eval_steps: 50
  eval_on_start: true
  eval_on_end: true

data:
  dataset: "tinyshakespeare"
  tokenizer: "gpt2"
  seed: 42

logging:
  enabled: true
  project: "nanogpt-equinox"
  tags: ["tinyshakespeare", "mhla"]
  save_code: true
